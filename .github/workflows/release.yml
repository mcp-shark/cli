name: Create Release and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Update package.json version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          npm version ${VERSION#v} --no-git-tag-version
      
      - name: Run linting
        run: npm run lint
      
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create release archive
        run: |
          mkdir -p release
          cp -r cli.js lib package.json package-lock.json release/
          cp install.sh mcp-shark-cli release/
          tar -czf mcp-shark-cli-${{ steps.get_version.outputs.VERSION }}.tar.gz -C release .
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-shark-cli-${{ steps.get_version.outputs.VERSION }}.tar.gz
          body: |
            ## Installation
            
            ### npm (Recommended)
            ```bash
            npm install -g @mcp-shark/cli
            ```
            
            ### GitHub Quick Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/mcp-shark-org/cli/${{ steps.get_version.outputs.VERSION }}/install.sh | bash
            ```
            
            ### Direct Execution
            ```bash
            curl -fsSL https://raw.githubusercontent.com/mcp-shark-org/cli/${{ steps.get_version.outputs.VERSION }}/mcp-shark-cli | bash -s -- --help
            ```
            
            See [INSTALL.md](https://github.com/mcp-shark-org/cli/blob/${{ steps.get_version.outputs.VERSION }}/INSTALL.md) for more installation options.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

